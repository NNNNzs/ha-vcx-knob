pair_bluetooth_device:
  name: 配对蓝牙设备
  description: 通过 bluetoothctl 配对 VCX-Knob 蓝牙设备
  fields:
    device_address:
      name: 设备 MAC 地址
      description: 蓝牙设备的 MAC 地址（例如：88:36:A2:D8:80:AC）
      required: true
      selector:
        text:
    timeout:
      name: 超时时间
      description: 配对超时时间（秒）
      required: false
      default: 15
      selector:
        number:
          min: 5
          max: 60
          step: 1
          unit_of_measurement: 秒

scan_bluetooth_device:
  name: 扫描蓝牙设备
  description: 扫描附近的 VCX-Knob 蓝牙设备
  fields:
    timeout:
      name: 超时时间
      description: 扫描超时时间（秒）
      required: false
      default: 10
      selector:
        number:
          min: 5
          max: 60
          step: 1
          unit_of_measurement: 秒
    device_filter:
      name: 设备名称过滤器
      description: 用于筛选设备名称的关键词
      required: false
      default: VCX
      selector:
        text:

get_bluetooth_device_info:
  name: 获取蓝牙设备信息
  description: 获取蓝牙设备的配对、信任和连接状态
  fields:
    device_address:
      name: 设备 MAC 地址
      description: 蓝牙设备的 MAC 地址
      required: true
      selector:
        text:
